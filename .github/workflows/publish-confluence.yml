name: Publish architecture docs to Confluence

on:
  push:
    branches: [main]
    paths:
      - docs/architecture/notification-service/**
      - scripts/publish_confluence.py
      - .github/workflows/publish-confluence.yml

permissions:
  contents: read

# One publish at a time, so an older commit cannot overwrite a newer one.
concurrency:
  group: publish-confluence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        run: python3 scripts/publish_confluence.py publish --rev "$GITHUB_SHA"
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
